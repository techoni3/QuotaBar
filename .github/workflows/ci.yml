name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Assemble app bundle (smoke)
        run: |
          scripts/make-app.sh
          test -d dist/AIMeter.app/Contents/MacOS
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/AIMeter.app/Contents/Info.plist