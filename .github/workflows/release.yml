name: release

# Signed + notarized DMG on every v* tag, attached to a GitHub Release with the
# Sparkle appcast. Secrets required (repo Settings → Secrets and variables):
#   DEVELOPER_ID_P12          base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID — notarytool credentials
#                               (stored on the runner as a keychain profile);
#                               NOTARYTOOL_PROFILE overrides the profile name.
on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build + test
        run: |
          swift build -c release
          swift test

      - name: Import Developer ID certificate
        if: ${{ env.HAS_DEVELOPER_ID == 'true' }}
        env:
          P12_B64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 --decode > /tmp/dev.p12
          security create-keychain -p "" /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p "" /tmp/build.keychain
          security import /tmp/dev.p12 -k /tmp/build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" /tmp/build.keychain
          rm -f /tmp/dev.p12

      - name: Store notary credentials
        if: ${{ env.HAS_NOTARY_CREDENTIALS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARYTOOL_PROFILE: ${{ secrets.NOTARYTOOL_PROFILE }}
        run: |
          PROFILE="${NOTARYTOOL_PROFILE:-AIMeter-Notary}"
          xcrun notarytool store-credentials "$PROFILE" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --keychain /tmp/build.keychain
          echo "notary_profile=$PROFILE" >> "$GITHUB_ENV"

      - name: Run release pipeline
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          AIMETER_NOTARY_PROFILE: ${{ env.notary_profile }}
          AIMETER_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          AIMETER_SU_FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/docs/aimeter-appcast.xml
        run: scripts/release.sh

      - name: Publish GitHub Release (DMG + appcast)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/AIMeter-*.dmg docs/aimeter-appcast.xml \
            --title "AIMeter $GITHUB_REF_NAME" \
            --notes "Signed + notarized DMG. Auto-update via Sparkle (docs/aimeter-appcast.xml)." \
          || gh release edit "$GITHUB_REF_NAME" \
            --attach-on-replace \
            --notes "Signed + notarized DMG. Auto-update via Sparkle (docs/aimeter-appcast.xml)."